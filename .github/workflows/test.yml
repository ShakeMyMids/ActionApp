name: Test

on:
  push:
    branches: ['**']
  pull_request:
  workflow_dispatch:

# Su push rapidi consecutivi conta solo l'ultimo: le esecuzioni superate
# vengono annullate invece di occupare i runner fino in fondo.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  playwright:
    name: Playwright (${{ matrix.project }})
    # Una pull request dallo stesso repository ha gia' la sua esecuzione da
    # push sul branch: qui si tiene solo quella, mentre le pull request dai
    # fork — che non fanno scattare il push — restano coperte.
    if: >-
      github.event_name != 'pull_request' ||
      github.event.pull_request.head.repo.full_name != github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        project: [chromium, mobile]

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      # npm ci invece di npm install: installa esattamente le versioni del
      # lockfile, cosi' una nuova release di Playwright non entra in CI da sola.
      - name: Installa le dipendenze
        run: npm ci

      # Solo Chromium: la suite non usa Firefox né WebKit.
      - name: Installa il browser
        run: npx playwright install --with-deps chromium

      - name: Esegui i test
        run: npx playwright test --project=${{ matrix.project }}

      - name: Conserva il report in caso di fallimento
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report-${{ matrix.project }}
          path: playwright-report/
          retention-days: 7
